# PayTrue on its own subdomain (nginx): https://pay.example.com/...   (the recommended layout)
#   PAYTRUE_PUBLIC_ORIGIN=https://pay.example.com   PAYTRUE_BASE_PATH=/
# Certificates: use your own (the paths below are placeholders). Not run by this repository's checks: validate with `nginx -t` before use.

server {
    listen 443 ssl http2;
    server_name pay.example.com;

    ssl_certificate     /etc/ssl/certs/pay.example.com.pem;
    ssl_certificate_key /etc/ssl/private/pay.example.com.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
