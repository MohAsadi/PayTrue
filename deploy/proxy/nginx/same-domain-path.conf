# PayTrue under a PATH of a domain you already serve (nginx). Put these `location` blocks inside your existing `server { ... }` for example.com.
#   PAYTRUE_PUBLIC_ORIGIN=https://example.com   PAYTRUE_BASE_PATH=/paytrue
# TRADE-OFF (docs/domains.md): the checkout shares an origin with the rest of the site. Prefer a subdomain (subdomain.conf).
# Not run by this repository's checks: validate with `nginx -t` before use.

# Variant A: the proxy KEEPS the prefix (no trailing slash after the upstream). PAYTRUE_PROXY_STRIPS_BASE_PATH=false
location /paytrue/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# Variant B: the proxy STRIPS the prefix (a trailing slash after the upstream). PAYTRUE_PROXY_STRIPS_BASE_PATH=true
# location /paytrue/ {
#     proxy_pass http://127.0.0.1:8080/;
#     ... the same headers ...
# }
